<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basilisk Tree</title>
<meta name="description" content="A tech tree of human knowledge, from stone tools to the open frontier. Solve an open problem and your name goes on the tree.">
<meta name="theme-color" content="#0a0f1e">
<meta property="og:title" content="Basilisk Tree">
<meta property="og:description" content="A tech tree of human knowledge, from stone tools to the open frontier. Solve an open problem and your name goes on the tree.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://basilisktree.org/">
<meta property="og:image" content="https://basilisktree.org/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0f1e'/%3E%3Cpath d='M10 28c0-6 12-6 12-11.5S12 11 15.5 5' fill='none' stroke='%23c9d3ee' stroke-width='1.8' stroke-linecap='round'/%3E%3Ccircle cx='10' cy='27' r='2.4' fill='%23c9d3ee'/%3E%3Ccircle cx='21.6' cy='16.5' r='2.4' fill='%23c9d3ee'/%3E%3Ccircle cx='15.5' cy='5.5' r='3' fill='none' stroke='%23f2c46d' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <a class="brand" href="#explore" aria-label="Basilisk Tree: about this map">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M10 28c0-6 12-6 12-11.5S12 11 15.5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="10" cy="28" r="2.2" fill="currentColor"/>
        <circle cx="21.6" cy="16.5" r="2.2" fill="currentColor"/>
        <circle cx="15.5" cy="5" r="3" fill="none" stroke="var(--gold)" stroke-width="1.4" stroke-dasharray="2.2 1.6"/>
      </svg>
      <span class="brand-name">Basilisk Tree</span>
    </a>

    <div class="search" role="search">
      <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="search-input" type="search" placeholder="Search discoveries, problems, people" autocomplete="off" spellcheck="false" aria-label="Search discoveries, problems and people" aria-controls="search-results" aria-expanded="false">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
      <ul id="search-results" class="search-results" role="listbox" hidden></ul>
    </div>

    <nav class="top-actions" aria-label="Sections">
      <button id="btn-random" class="btn btn-gold" type="button" title="Fly to a random open problem (R)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2.6 2"/><circle cx="10" cy="10" r="1.6" fill="currentColor"/></svg>
        <span>Random frontier</span>
      </button>
      <button class="btn btn-quiet top-tab" type="button" data-tab="frontier">Frontier</button>
      <button class="btn btn-quiet top-tab" type="button" data-tab="ledger">Ledger</button>
      <button class="btn btn-quiet top-tab" type="button" data-tab="explore">About</button>
    </nav>
  </header>

  <main id="viewport" class="viewport" aria-label="Map of discoveries. Drag to pan; scroll or pinch to zoom.">
    <canvas id="sky" class="sky" aria-hidden="true"></canvas>
    <div id="world" class="world">
      <div id="lanes" class="lanes" aria-hidden="true"></div>
      <div id="nodes" class="nodes"></div>
    </div>
    <div id="ruler" class="ruler" aria-hidden="true"></div>
    <div id="lane-strip" class="lane-strip" aria-label="Domains"></div>
    <div class="map-controls" aria-label="Zoom">
      <button id="zoom-in" class="ctl" type="button" aria-label="Zoom in">+</button>
      <button id="zoom-out" class="ctl" type="button" aria-label="Zoom out">−</button>
      <button id="zoom-fit" class="ctl ctl-wide" type="button" aria-label="Show the whole tree">All</button>
    </div>
    <p id="status" class="status" role="status">Loading the tree…</p>
  </main>

  <aside id="panel" class="panel" aria-label="Details">
    <div class="panel-head" id="panel-head">
      <span class="sheet-grip" aria-hidden="true"></span>
      <div class="tabs" role="tablist" aria-label="Panel sections">
        <button class="tab" role="tab" type="button" data-tab="explore" aria-selected="true">About</button>
        <button class="tab" role="tab" type="button" data-tab="frontier" aria-selected="false">Frontier</button>
        <button class="tab" role="tab" type="button" data-tab="ledger" aria-selected="false">Ledger</button>
      </div>
      <button id="panel-close" class="icon-btn" type="button" aria-label="Hide panel">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="panel-body" class="panel-body"></div>
  </aside>
  <button id="panel-open" class="panel-open btn btn-quiet" type="button" hidden>Details</button>
</div>
<script src="app.js" defer></script>
</body>
</html>
