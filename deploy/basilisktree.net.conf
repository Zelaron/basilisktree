# basilisktree.net and www.basilisktree.net redirect to https://basilisktree.org.
# ACME challenges are exempt so certbot can issue a certificate for the redirect itself.
# certbot disables this rewrite in the HTTPS copy it generates (basilisktree.net-le-ssl.conf);
# there, replace it with:  Redirect permanent / https://basilisktree.org/
<VirtualHost *:80>
	ServerName basilisktree.net
	ServerAlias www.basilisktree.net
	DocumentRoot /var/www/basilisktree.org/public_html
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	RewriteEngine on
	RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
	RewriteRule ^ https://basilisktree.org%{REQUEST_URI} [R=301,L]
</VirtualHost>
