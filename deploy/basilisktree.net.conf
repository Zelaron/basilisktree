# basilisktree.net and www.basilisktree.net (the site's first name) redirect permanently to
# https://techtree.earth, keeping the path, so old links keep working. ACME challenges are exempt
# so certbot can keep renewing this certificate. The HTTPS copy certbot generated
# (basilisktree.net-le-ssl.conf) redirects the same way:
#   RewriteEngine on
#   RewriteRule ^ https://techtree.earth%{REQUEST_URI} [R=301,L,NE]
<VirtualHost *:80>
	ServerName basilisktree.net
	ServerAlias www.basilisktree.net
	DocumentRoot /var/www/basilisktree.org/public_html
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	RewriteEngine on
	RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
	RewriteRule ^ https://techtree.earth%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>
