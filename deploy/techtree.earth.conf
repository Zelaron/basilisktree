# Apache virtual host for techtree.earth. certbot adds the HTTPS twin (techtree.earth-le-ssl.conf),
# where www.techtree.earth is redirected to the bare domain.
# sync.sh publishes the site into public_html; its git checkout in ../live stays outside the web root.
<VirtualHost *:80>
	ServerName techtree.earth
	ServerAlias www.techtree.earth
	DocumentRoot /var/www/techtree.earth/public_html
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	<Directory /var/www/techtree.earth/public_html>
		Options -Indexes
		AllowOverride None
		Require all granted
	</Directory>

	<IfModule mod_headers.c>
		<FilesMatch "\.(html|json|js|css)$">
			Header set Cache-Control "no-cache"
		</FilesMatch>
		Header always set X-Content-Type-Options "nosniff"
		Header always set Referrer-Policy "strict-origin-when-cross-origin"
	</IfModule>
	<IfModule mod_deflate.c>
		AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
	</IfModule>
</VirtualHost>
