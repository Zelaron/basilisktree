# Apache virtual host for basilisktree.org. certbot adds the HTTPS twin (basilisktree.org-le-ssl.conf).
# sync.sh publishes the site into public_html; its git checkout in ../live stays outside the web root.
<VirtualHost *:80>
	ServerName basilisktree.org
	ServerAlias www.basilisktree.org
	DocumentRoot /var/www/basilisktree.org/public_html
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	<Directory /var/www/basilisktree.org/public_html>
		Options -Indexes
		AllowOverride None
		Require all granted
	</Directory>

	<IfModule mod_headers.c>
		<FilesMatch "\.(html|json|js|css)$">
			Header set Cache-Control "no-cache"
		</FilesMatch>
		Header always set X-Content-Type-Options "nosniff"
		Header always set Referrer-Policy "strict-origin-when-cross-origin"
	</IfModule>
	<IfModule mod_deflate.c>
		AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
	</IfModule>
</VirtualHost>
